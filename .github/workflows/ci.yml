name: CI

on:
  push:
  pull_request:

permissions:
  contents: read


jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      
      - name: Check formatting
        run: ruff format --check .

      - name: Lint
        run: ruff check .
      
      - name: Run tests
        run: python -m pytest